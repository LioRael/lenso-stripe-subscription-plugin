[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-stripe-subscription",
    "crates/lenso-capability-stripe-subscription-admin",
    "crates/lenso-stripe-subscription-plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = true
repository = "https://github.com/LioRael/lenso-stripe-subscription-plugin"
rust-version = "1.94"

[workspace.dependencies]
aes-gcm = "0.10"
futures = "0.3"
getrandom = "0.4"
hmac = "0.12"
lenso = { version = "0.5.0" }
lenso-capability-billing-meter-sink = { version = "0.1.0" }
lenso-capability-entitlements-admin = { version = "0.1.0" }
lenso-capability-http-client = { version = "0.2.3" }
lenso-capability-secrets = { version = "0.1.1" }
lenso-contract-runtime = { version = "0.1.3" }
lenso-kernel = { version = "0.2.0" }
lenso-plugin-authoring = { version = "0.1.1" }
lenso-postgres-kit = { version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "time"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
url = "2.5"
uuid = { version = "1.19", features = ["v4"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
