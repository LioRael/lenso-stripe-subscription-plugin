[package]
name = "lenso-stripe-subscription-plugin"
version = "0.1.0"
description = "Durable Stripe Billing subscription Plugin for Lenso applications."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.lenso]
plugin-id = "lenso.stripe-subscription"
root-slot = "billing"

[features]
default = []
postgres-acceptance = []

[dependencies]
aes-gcm.workspace = true
getrandom.workspace = true
hmac.workspace = true
lenso.workspace = true
lenso-capability-entitlements-admin.workspace = true
lenso-capability-http-client.workspace = true
lenso-capability-secrets.workspace = true
lenso-capability-stripe-subscription = { path = "../lenso-capability-stripe-subscription", version = "0.1.0" }
lenso-capability-stripe-subscription-admin = { path = "../lenso-capability-stripe-subscription-admin", version = "0.1.0" }
lenso-kernel.workspace = true
lenso-postgres-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt"] }
